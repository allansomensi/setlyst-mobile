[package]
name = "setlyst-mobile"
version = "0.1.1"
description = "Setlyst client for Android"
authors = ["Allan Somensi <allansomensidev@proton.me>"]
edition = "2021"
license = "MIT"

[lib]
# Required so the mobile targets (Android/iOS) can link against this crate.
name = "setlyst_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.23", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tauri-plugin-http = { version = "2", features = ["json"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

[features]
# used by `tauri android init` / `tauri ios init`
custom-protocol = ["tauri/custom-protocol"]
